---
# Lints the files a pull request actually touches. Each job diffs against the
# merge base, so an unrelated stale sample won't block your PR.
name: Lint changed files

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cfn-lint:
    name: cfn-lint changed templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - name: Find changed CloudFormation templates
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Select by content: CFN templates also live under Components/
          git diff -z --name-only --diff-filter=ACMR "origin/${BASE_REF}"...HEAD \
            | grep -zE '\.(yml|yaml|template)$' \
            | sed -z 's|^|./|' \
            | xargs -0 -r grep -lZE '^(AWSTemplateFormatVersion|Resources):' > changed.txt || true
          echo "count=$(tr -cd '\0' < changed.txt | wc -c)" >> "$GITHUB_OUTPUT"
          tr '\0' '\n' < changed.txt
      - name: Run cfn-lint
        if: steps.changed.outputs.count != '0'
        run: |
          pip install cfn-lint==1.55.1
          xargs -0 -r cfn-lint --non-zero-exit-code error < changed.txt

  # awstoe validates a document against the action modules of the OS it runs
  # on, so Windows components (ExecutePowerShell and friends) fail on a Linux
  # runner. Components/Windows/ documents get the Windows binary on a Windows
  # runner; everything else runs on Linux.
  awstoe-validate:
    name: awstoe validate changed components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - name: Find changed component documents
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # AWSTOE documents are identified by their top-level schemaVersion key,
          # regardless of directory - the same tree also holds CFN templates and
          # Ansible playbooks, which awstoe rejects
          git diff -z --name-only --diff-filter=ACMR "origin/${BASE_REF}"...HEAD \
            | grep -zE '\.(yml|yaml)$' \
            | grep -zv '^Components/Windows/' \
            | sed -z 's|^|./|' \
            | xargs -0 -r grep -lZ '^schemaVersion:' > changed.txt || true
          echo "count=$(tr -cd '\0' < changed.txt | wc -c)" >> "$GITHUB_OUTPUT"
          tr '\0' '\n' < changed.txt
      - name: Validate with awstoe
        if: steps.changed.outputs.count != '0'
        run: |
          # awstoe is the engine that runs components on build instances.
          # Verify the binary against the AWSTOE signing key before running
          # it; the pinned fingerprint is published in the Image Builder docs.
          # Download outside the checkout: the tree has an awstoe/ directory
          # that a file named awstoe would collide with.
          tool="$(mktemp -d)"
          curl -sSf -o "$tool/awstoe" https://awstoe-us-east-1.s3.us-east-1.amazonaws.com/latest/linux/amd64/awstoe
          curl -sSf -o "$tool/awstoe.sig" https://awstoe-us-east-1.s3.us-east-1.amazonaws.com/latest/linux/amd64/awstoe.sig
          curl -sSf -o "$tool/awstoe.gpg" https://awstoe-us-east-1.s3.us-east-1.amazonaws.com/latest/assets/awstoe.gpg
          gpg --import "$tool/awstoe.gpg"
          # Bind the verification to the pinned key: VALIDSIG carries the
          # signing key's fingerprint, so a keyring with extra keys can't
          # satisfy this check.
          gpg --status-fd 1 --verify "$tool/awstoe.sig" "$tool/awstoe" \
            | grep -q 'VALIDSIG.*F6DDE01C869FD63915E55742DEBDC156F5AEBC52'
          chmod +x "$tool/awstoe"
          failed=0
          while IFS= read -rd '' doc; do
            echo "::group::$doc"
            "$tool/awstoe" validate --documents "$doc" || failed=1
            echo "::endgroup::"
          done < changed.txt
          exit "$failed"

  awstoe-validate-windows:
    name: awstoe validate changed Windows components
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - name: Find changed Windows component documents
        id: changed
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff -z --name-only --diff-filter=ACMR "origin/${BASE_REF}"...HEAD \
            | grep -zE '\.(yml|yaml)$' \
            | grep -z '^Components/Windows/' \
            | sed -z 's|^|./|' \
            | xargs -0 -r grep -lZ '^schemaVersion:' > changed.txt || true
          echo "count=$(tr -cd '\0' < changed.txt | wc -c)" >> "$GITHUB_OUTPUT"
          tr '\0' '\n' < changed.txt
      - name: Validate with awstoe
        if: steps.changed.outputs.count != '0'
        shell: pwsh
        run: |
          # AWS signs the Windows binary with Authenticode rather than
          # publishing a detached signature, so verification differs from the
          # Linux job's GPG check.
          Invoke-WebRequest -Uri https://awstoe-us-east-1.s3.us-east-1.amazonaws.com/latest/windows/amd64/awstoe.exe -OutFile awstoe.exe
          $sig = Get-AuthenticodeSignature .\awstoe.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*Amazon*') {
            throw "awstoe.exe signature check failed: $($sig.Status)"
          }
          $failed = 0
          foreach ($doc in (Get-Content -Raw changed.txt) -split "`0" | Where-Object { $_ }) {
            Write-Output "::group::$doc"
            .\awstoe.exe validate --documents "$doc"
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
            Write-Output "::endgroup::"
          }
          exit $failed

  params-parse:
    name: JSON parameter files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - name: Parse changed JSON files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff -z --name-only --diff-filter=ACMR "origin/${BASE_REF}"...HEAD \
            | grep -zE '\.json$' | grep -zv package-lock > changed.txt || true
          failed=0
          while IFS= read -rd '' f; do
            echo "checking $f"
            python3 -m json.tool "./$f" > /dev/null || failed=1
          done < changed.txt
          exit "$failed"
