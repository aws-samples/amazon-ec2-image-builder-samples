AWSTemplateFormatVersion: 2010-09-09

Description: >
  EC2 Image Builder container pipeline: builds an Amazon Linux 2023 base
  container image on a weekly schedule and pushes it to Amazon ECR, with
  optional replication to a second Region and optional Inspector scanning.

Parameters:
  ReplicaRegion:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z]{2}(-[a-z]+)+-\d$'
    Description: >-
      Optional second region to push each image to - different from the
      stack's own, with an ECR repository named like this stack's already
      there (see the README's Testing section). Leave empty for
      single-region.
  EnableScanning:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Scan each output image with Amazon Inspector. Requires Inspector to be
      activated in the account first, and Inspector is a paid service.

Conditions:
  HasReplicaRegion: !Not [!Equals [!Ref ReplicaRegion, '']]
  ScanningEnabled: !Equals [!Ref EnableScanning, 'true']

Resources:
  # One repository per pipeline. Image Builder pushes fixed tags with every
  # build (<version>-<build> and <name>-<version>-<build>) in addition to the
  # tags below - two pipelines sharing a repository collide on them, which
  # silently overwrites images on a mutable repository and fails the build on
  # an immutable one.
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: container-sample
      # EmptyOnDelete destroys every image with the stack - drop it for a
      # production repository.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  # Receives the detailed AWSTOE log bundle from each build. Component
  # output streams to CloudWatch; this bucket holds the full bundle, which
  # otherwise vanishes with the container.
  BuildLogBucket:
    Type: AWS::S3::Bucket
    # To keep the bucket when deleting the stack, set DeletionPolicy: Retain.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Build logs are only useful for recent troubleshooting - expire
          # them so the bucket doesn't accumulate cost
          - Id: ExpireBuildLogs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 1

  LogBucketTlsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BuildLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${BuildLogBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${BuildLogBucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: EnforceTlsVersion
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${BuildLogBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${BuildLogBucket}/*'
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        # The ECR container-builds policy carries the component download and
        # ECR push/pull permissions container builds need.
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/EC2InstanceProfileForImageBuilder'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/EC2InstanceProfileForImageBuilderECRContainerBuilds'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: ship-build-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BuildLogBucket}/*'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
      Path: /executionServiceEC2Role/

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /executionServiceEC2Role/
      Roles:
        - !Ref InstanceRole

  # Runs inside the container during the build - the resulting changes are
  # container image layers, not build-instance state. The test phase runs in
  # the container too, on the same build instance (AMI pipelines use a fresh
  # test instance instead).
  BaselineComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: container-sample-baseline
      # Components don't accept x wildcards at creation. Keep the version
      # fixed - the service increments the build number behind it when the
      # document changes.
      Version: 1.0.0
      Platform: Linux
      Description: Installs a baseline package in the image and verifies it.
      Data: |
        name: container-sample-baseline
        description: Installs a baseline package in the image and verifies it.
        schemaVersion: 1.0
        parameters:
          - package:
              type: string
              default: jq
              description: Package to install.
        phases:
          - name: build
            steps:
              - name: InstallPackage
                action: ExecuteBash
                inputs:
                  commands:
                    # Clean the metadata cache in the same layer it was created.
                    - dnf -y install {{ package }} && dnf clean all
          - name: validate
            steps:
              - name: VerifyInstalled
                action: ExecuteBash
                inputs:
                  commands:
                    - rpm -q {{ package }}
          - name: test
            steps:
              - name: RunTool
                action: ExecuteBash
                inputs:
                  commands:
                    - echo '{"ok":true}' | jq -e .ok

  ContainerRecipe:
    Type: AWS::ImageBuilder::ContainerRecipe
    Properties:
      Name: container-sample
      # Every property change replaces the recipe; the x placeholder
      # auto-increments the version on each replacement.
      Version: 1.0.x
      ContainerType: DOCKER
      # An Image Builder managed base image: the pipeline's dependency-update
      # start condition tracks it, so a new base release triggers a rebuild.
      # Docker Hub and ECR image URIs work here too - those need
      # PlatformOverride, and ECR sources in another account also need
      # ecr:DescribeImages plus the pull actions in the repository policy.
      ParentImage: !Sub 'arn:${AWS::Partition}:imagebuilder:${AWS::Region}:aws:image/amazon-linux-2023-x86-2023/x.x.x'
      Components:
        - ComponentArn: !GetAtt BaselineComponent.LatestVersion.Arn
          Parameters:
            - Name: package
              Value:
                - jq
      # The three variables are the contract: parentImage becomes the FROM
      # line, environments stages the component scripts, components runs them
      # and removes them. Inline templates cap at 16,000 characters - larger
      # Dockerfiles move to DockerfileTemplateUri (an S3 object).
      DockerfileTemplateData: |
        FROM {{{ imagebuilder:parentImage }}}
        {{{ imagebuilder:environments }}}
        {{{ imagebuilder:components }}}
      TargetRepository:
        Service: ECR
        RepositoryName: !Ref Repository
      WorkingDirectory: /tmp
      # The build instance's AMI - a separate operating system from the
      # container's base image above. Pinned to the ECS-optimized AMI the
      # service would pick anyway, to make the build host explicit.
      InstanceConfiguration:
        Image: 'ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id'

  InfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: container-sample
      InstanceProfileName: !Ref InstanceProfile
      InstanceTypes:
        - t3.medium
      # Container builds run docker on the instance, which adds a network hop
      # to instance metadata - a hop limit of 1 with required tokens breaks
      # credentials inside the container.
      InstanceMetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Logging:
        S3Logs:
          S3BucketName: !Ref BuildLogBucket
          S3KeyPrefix: container-sample

  DistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: container-sample
      Distributions: !If
        - HasReplicaRegion
        - - Region: !Ref AWS::Region
            ContainerDistributionConfiguration:
              TargetRepository:
                Service: ECR
                RepositoryName: !Ref Repository
              ContainerTags:
                - latest
          - Region: !Ref ReplicaRegion
            ContainerDistributionConfiguration:
              TargetRepository:
                Service: ECR
                RepositoryName: !Ref Repository
              ContainerTags:
                - latest
        - - Region: !Ref AWS::Region
            ContainerDistributionConfiguration:
              TargetRepository:
                Service: ECR
                RepositoryName: !Ref Repository
              ContainerTags:
                - latest

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/imagebuilder/container-sample
      RetentionInDays: 7

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/imagebuilder/pipeline/container-sample
      RetentionInDays: 7

  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: container-sample
      Description: Weekly Amazon Linux 2023 base container image.
      ContainerRecipeArn: !Ref ContainerRecipe
      InfrastructureConfigurationArn: !Ref InfrastructureConfiguration
      DistributionConfigurationArn: !Ref DistributionConfiguration
      LoggingConfiguration:
        ImageLogGroupName: !Ref BuildLogGroup
        PipelineLogGroupName: !Ref PipelineLogGroup
      # Rebuilds when the managed base image or a component dependency has a
      # new version at the scheduled time.
      Schedule:
        ScheduleExpression: cron(0 9 ? * mon *)
        PipelineExecutionStartCondition: EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE
      ImageScanningConfiguration: !If
        - ScanningEnabled
        - ImageScanningEnabled: true
          EcrConfiguration:
            RepositoryName: !Ref Repository
        - !Ref AWS::NoValue

Outputs:
  ImagePipelineArn:
    Description: >-
      ARN of the image pipeline. Start a build with 'aws imagebuilder
      start-image-pipeline-execution --image-pipeline-arn <this value>'.
    Value: !Ref ImagePipeline
  RepositoryUri:
    Description: The ECR repository the pipeline pushes to.
    Value: !GetAtt Repository.RepositoryUri
