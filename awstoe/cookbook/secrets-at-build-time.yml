name: secrets-at-build-time
description: >-
  Reads a secret at build time through the native SSM parameter reference:
  the instance profile resolves it on the instance and the service keeps
  the resolved SecureString out of its logs. The document takes the
  secret's name as an input, never its value.
schemaVersion: 1.0
parameters:
  - secretParameterName:
      type: string
      default: /cookbook/build-secret
      description: >-
        SecureString parameter to read. A Secrets Manager secret works too,
        through the /aws/reference/secretsmanager/<secret-name> path. The
        value must be a single line - a multi-line value fails the step -
        so store multi-line material like PEM keys base64-encoded.
phases:
  - name: build
    steps:
      - name: UseSecret
        action: ExecuteBash
        # The service excludes the resolved value from its logs; a command
        # that echoes it puts it back in. disableLogging suppresses this
        # step's remaining output as well.
        disableLogging: true
        inputs:
          commands:
            - |
              # The quoted heredoc keeps a value containing quotes, $, or
              # spaces from being interpreted or trimmed by the shell.
              SECRET=$(cat <<'RESOLVED'
              {{ aws:ssm:resolve(secretParameterName) }}
              RESOLVED
              )
              test -n "$SECRET" || { echo 'secret is empty'; exit 1; }
              # Use the value transiently (authenticate a download, register
              # with a service, ...) - pass it through stdin or an environment
              # variable, not a command-line argument, and never write it
              # into the image.
              echo 'Secret resolved and used; value not logged.'
