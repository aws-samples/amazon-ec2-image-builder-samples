AWSTemplateFormatVersion: 2010-09-09

Description: >
  EC2 Image Builder sample: the role a target account needs to receive
  encrypted AMI copies from a source account's Image Builder pipeline. Deploy
  once in every target account. The template contains no account-specific
  values beyond its parameters, so it also deploys cleanly as a StackSet.

Parameters:
  SourceAccountId:
    Type: String
    AllowedPattern: ^\d{12}$
    ConstraintDescription: Must be a 12-digit AWS account ID.
    Description: >-
      The account that runs the Image Builder pipeline. Only this account can
      assume the distribution role - keep it pinned to the single source
      account you control.

  SourceKmsKeyArn:
    Type: String
    AllowedPattern: ^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:\d{12}:key/.+$
    ConstraintDescription: Must be a KMS key ARN.
    Description: >-
      ARN of the source account's customer managed key that encrypts the AMI
      (the KmsKeyArn output of source-account.yml).

Resources:
  # Image Builder looks this role up by its fixed, service-defined name when
  # it distributes to this account - a role with any other name is never
  # assumed, and distribution fails as if no role existed.
  DistributionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EC2ImageBuilderDistributionCrossAccountRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Image Builder assumes this role FROM the source account, so the
          # trusted principal is the source account root - not the
          # imagebuilder.amazonaws.com service principal. Widening this to '*'
          # or an organization path lets every matching account push AMIs into
          # this account and write its SSM parameters.
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${SourceAccountId}:root'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # The EC2 side of receiving a copy: CopyImage and the related EC2
        # actions the service performs in this account.
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/Ec2ImageBuilderCrossAccountDistributionAccess'
      Policies:
        - PolicyName: CrossAccountDistributionAdditions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Decrypts the source snapshot and re-encrypts this account's
              # copy. Without it, distribution fails with a KMS AccessDenied
              # (typically on kms:CreateGrant or kms:DescribeKey) and no AMI
              # appears in this account.
              - Sid: UseSourceKmsKey
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                  - kms:CreateGrant
                  - kms:ListGrants
                  - kms:RevokeGrant
                Resource: !Ref SourceKmsKeyArn
              # Writes the AMI ID parameter for this account's copy. Without
              # it, the AMI still arrives but the SSM parameter write fails
              # and the parameter never appears in this account.
              - Sid: WriteImageBuilderParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/imagebuilder/*'
              # The aws:ec2:image parameter data type validates the AMI ID
              # on write, which requires ec2:DescribeImages. The managed policy
              # above also grants it; this mirrors the documented role setup.
              - Sid: ValidateAmiParameters
                Effect: Allow
                Action:
                  - ec2:DescribeImages
                Resource: '*'

Outputs:
  DistributionRoleArn:
    Description: Role Image Builder assumes from the source account.
    Value: !GetAtt DistributionRole.Arn
